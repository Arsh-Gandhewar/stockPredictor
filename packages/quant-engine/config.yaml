features:
  lookback_periods: [1, 3, 5, 10, 20, 60, 100, 200]
targets:
  horizons: [1, 5, 20]
  thresholds:
    1: 0.003
    5: 0.010
    20: 0.030
training:
  train_years: 3
  val_months: 6
  test_months: 6
transaction_costs:
  brokerage: 0.0003
  stt_sell: 0.001
  exchange: 0.0000345
  gst_on_brokerage: 0.18
  stamp_duty: 0.00015
  sebi: 0.000001
  slippage_bps: 5
model:
  lightgbm:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.05
    objective: 'binary'
    boosting_type: 'gbdt'
    metric: 'auc'
    subsample: 0.8
    colsample_bytree: 0.8
calibration:
  method: 'isotonic'
