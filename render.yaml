services:
  - type: web
    name: quantx-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    repo: https://github.com/Arsh-Gandhewar/stockPredictor
    buildCommand: npm install && npm run build --workspace=apps/api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /stock/market-status
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-pro-latest
      - key: GEMINI_FLASH_MODEL
        value: gemini-1.5-flash-latest
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
