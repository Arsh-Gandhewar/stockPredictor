name: QuantX CI & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_ENV: test
  JWT_SECRET: quantx_institutional_test_jwt_secret_32bytes_long!
  ADMIN_USER_IDS: user_admin_001,user_admin_002
  ALLOW_LOCAL_MOCK_AUTH: 'false'
  GOVERNANCE_CI_SECRET: ${{ secrets.GOVERNANCE_CI_SECRET || 'quantx-gov-ci-salt-2026-v5-1' }}

jobs:
  verify:
    name: Institutional Test & Verification Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Node.js Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm --workspace=db run generate

      - name: Lint Codebase
        run: npm run lint
        continue-on-error: true

      - name: Typecheck API Service
        run: npx tsc --noEmit --project apps/api/tsconfig.build.json

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/quant-engine/requirements.txt pytest

      - name: Run Jest Unit & Integration Tests
        run: npm --workspace=api run test -- --forceExit

      - name: Run Jest AppModule Institutional E2E Tests
        run: npm --workspace=api run test:e2e

      - name: Run Pytest Quant Engine Suite
        run: python -m pytest packages/quant-engine -q

      - name: Run Financial MCP Server Tests
        run: npm run mcp:test

      - name: Run Engineering MCP Server Tests
        run: npm run mcp:eng:test

      - name: Record Signed Test Evidence
        run: node scripts/record-test-evidence.js

      - name: Verify Signed Test Evidence
        run: npm run verify:evidence

      - name: Extract Real Historical OOS Feed
        run: python scripts/extract-historical-backtest-feed.py

      - name: Generate Independent Economic Certification
        run: node scripts/generate-economic-certification.js

      - name: Verify Signed Economic Certification & Ledgers
        run: npm run verify:economic

      - name: Build API Service
        run: npm --workspace=api run build

      - name: Build Web Application
        run: npm --workspace=web run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_mock_key_for_build

      - name: Upload Governance Test & Economic Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quantx-governance-evidence
          path: |
            apps/api/data/artifacts/governance/test-evidence.json
            apps/api/data/artifacts/governance/economic-certification.json
            apps/api/data/artifacts/governance/economic-trade-ledger.json
