name: QuantX Institutional CI & Certification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-quant-engine:
    name: Python Quantitative Engine & Research Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov numpy scipy pandas scikit-learn lightgbm onnxruntime joblib

      - name: Run Pytest Suite with Coverage
        run: |
          python -m pytest packages/quant-engine/tests/ -v --cov=packages/quant-engine/

  typescript-api-and-web:
    name: TypeScript API, Database, and Web Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm --workspace=db run generate

      - name: Run API Unit & Integration Tests
        run: npm --workspace=api run test

      - name: Build API Gateway
        run: npm --workspace=api run build

      - name: Build Web Application
        run: npm --workspace=web run build

  release-attestation-verification:
    name: Cryptographic Attestation Verification
    runs-on: ubuntu-latest
    needs: [python-quant-engine, typescript-api-and-web]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Post-Commit Attestation
        run: node scripts/sync-manifests.js --verify
